name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f compose.casa.yml config --quiet

  docker:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/emotebot6/clipscreator-backend
          - service: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: ghcr.io/emotebot6/clipscreator-frontend
          - service: frontend_sitcom
            context: ./frontend_sitcom
            file: ./frontend_sitcom/Dockerfile
            image: ghcr.io/emotebot6/clipscreator-frontend-sitcom
          - service: frontend_tshirts
            context: ./frontend_tshirts
            file: ./frontend_tshirts/Dockerfile
            image: ghcr.io/emotebot6/clipscreator-frontend-tshirts
          - service: image_generator
            context: ./image_generator
            file: ./image_generator/Dockerfile
            image: ghcr.io/emotebot6/clipscreator-image-generator

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
